# Use this file to run the stack with locally built images instead of pulling from the registry.
# Usage: docker compose -f docker-compose-local.yml up -d
# Build first: docker compose -f docker-compose-local.yml build
version: "3"
services:
  wireguard-webadmin:
    container_name: wireguard-webadmin
    restart: unless-stopped
    image: eduardosilva/wireguard_webadmin:latest
    build:
      context: .
    environment:
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - DEBUG_MODE=${DEBUG_MODE}
      - COMPOSE_VERSION=c1b
      - TZ=${TIMEZONE}
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS}
      - WIREGUARD_STATUS_CACHE_ENABLED=${WIREGUARD_STATUS_CACHE_ENABLED}
      - WIREGUARD_STATUS_CACHE_WEB_LOAD_PREVIOUS_COUNT=${WIREGUARD_STATUS_CACHE_WEB_LOAD_PREVIOUS_COUNT}
      - WIREGUARD_STATUS_CACHE_REFRESH_INTERVAL=${WIREGUARD_STATUS_CACHE_REFRESH_INTERVAL}
    volumes:
      - wireguard:/etc/wireguard
      - static_volume:/app_static_files/
      - dnsmasq_conf:/etc/dnsmasq
      - app_secrets:/app_secrets/
      - rrd_data:/rrd_data/
    ports:
      - "51820-51839:51820-51839/udp"
      - "8080-8089:8080-8089/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    command: /bin/bash /app/init.sh

  wireguard-webadmin-cron:
    container_name: wireguard-webadmin-cron
    restart: unless-stopped
    image: eduardosilva/wireguard_webadmin_cron:latest
    build:
      context: containers/cron
      dockerfile: Dockerfile-cron
    environment:
      - TZ=${TIMEZONE}
      - WIREGUARD_STATUS_CACHE_REFRESH_INTERVAL=${WIREGUARD_STATUS_CACHE_REFRESH_INTERVAL}
    depends_on:
      - wireguard-webadmin

  wireguard-webadmin-rrdtool:
    container_name: wireguard-webadmin-rrdtool
    restart: unless-stopped
    image: eduardosilva/wireguard_webadmin_rrdtool:latest
    build:
      context: ./containers/rrdtool
      dockerfile: Dockerfile-rrdtool
    volumes:
      - app_secrets:/app_secrets/
      - rrd_data:/rrd_data/
    environment:
      - TZ=${TIMEZONE}
    depends_on:
      - wireguard-webadmin

  wireguard-webadmin-dns:
    container_name: wireguard-webadmin-dns
    restart: unless-stopped
    image: eduardosilva/wireguard_webadmin_dns:latest
    build:
      context: ./containers/dnsmasq
      dockerfile: Dockerfile-dnsmasq
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - dnsmasq_conf:/etc/dnsmasq/

  wireguard-webadmin-nginx:
    container_name: wireguard-webadmin-nginx
    restart: unless-stopped
    image: eduardosilva/wireguard_webadmin_nginx:latest
    build:
      context: .
      dockerfile: Dockerfile_nginx
    volumes:
      - static_volume:/static
      - https_cert:/certificate
    environment:
      - TZ=${TIMEZONE}
    ports:
      - "80:80"
      - "443:443"

volumes:
  static_volume:
  https_cert:
  wireguard:
  dnsmasq_conf:
  app_secrets:
  rrd_data:
